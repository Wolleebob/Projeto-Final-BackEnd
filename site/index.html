<body>
     <!-- CABEÇALHO FULL-WIDTH -->

    <main class="main-content">
        <div class="login-card">
            <!-- Título do formulário -->
            <div class="form-title">
              <i class="fas fa-lock"></i> Cadastre sua Conta
            </div>
        <form id = "form_cadastro"> 
        <label for="nome">Nome:</label>
        <input type="text" id="nome" placeholder="Digite seu nome" required class="input-texto">
        <label for="celular">Celular:</label>
        <input type="tel" id="celular" placeholder="(42) 99999-99999" required class="input-texto">
        <label for="cpf">CPF:</label>
        <input type="tel" id="cpf" placeholder="123.456.789-00" required class="input-texto">
        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="email@gmail.com" required class="input-texto">
        <label for = "senha">Senha:</label>
        <input type="password" id= senha required class = "input-texto">

        <!--
        <label for="cep">CEP:</label>

         <p id = "erro"></p>

        <!--
            CPF, CEP, Rua, Número, Bairro, Cidade, UF, Senha
        -->



        <input type="submit" id ="btn-enviar" value ="Enviar Cadastro" id="btn-enviar" class="btn-enviar">
    </div>
    </form>
   </main>
   <footer></footer>
   
   <script>
       function pegar_dados(){
        const dados = {
            nome: document.getElementById("nome").value,
            celular: document.getElementById("celular").value,
            cpf: document.getElementById("cpf").value,
            email: document.getElementById("email").value,
            senha: document.getElementById("senha").value           
        }
        return dados 
       }
       const form = document.getElementById("form_cadastro")
       const btn_enviar = document.getElementById("btn-enviar")
       form.addEventListener("submit", async (event) => {
            event.preventDefault() // evita o carregameto da página
            btn_enviar.disabled = true 
            btn_enviar.value = "Enviando..."

            const dados = pegar_dados()
            try {
                const resposta = await fetch("http://10.216.243.142:3000/cliente",{
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(dados)
                   }
            )
            if(!resposta.ok) throw new Error("Erro na API")
            alert("Cadastro realizado com sucesso!")
            form.reset()
            } catch (error) {
                alert(error)
            } finally {
                btn_enviar.disabled = false
                btn_enviar.value = "Enviar Cadastro"
            }
       })
   </script>
</body>
